# Selective tree-sitter grammar manifest for tspack.
# Default build compiles all entries with enabled = true (~22 core languages).
# Override selection at fetch/build time via:
#   TSPACK_LANGS=python,javascript,bash,c,cpp,rust,go,html,css,lua,toml,json

[languages.bash]
repo = "https://github.com/tree-sitter/tree-sitter-bash.git"
repo_dir = "tree-sitter-bash"
src_dir = "src"
symbol = "tree_sitter_bash"
enabled = true

[languages.c]
repo = "https://github.com/tree-sitter/tree-sitter-c.git"
repo_dir = "tree-sitter-c"
src_dir = "src"
symbol = "tree_sitter_c"
enabled = true

